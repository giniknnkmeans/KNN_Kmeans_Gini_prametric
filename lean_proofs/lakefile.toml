name = "knnGini"
version = "0.1.0"
keywords = ["math", "prametric", "knn", "kmeans"]
defaultTargets = ["KnnGini"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "KnnGini"
globs = [
  "KnnGini",
  "Basic",
  "GiniPrametric",
  "GeneralizedGini",
  "CoverHartBound",
  "KNNConvergence",
  "WeightedCentroid",
  "KMeansCounterexample",
  "KMeansConvergence",
]
